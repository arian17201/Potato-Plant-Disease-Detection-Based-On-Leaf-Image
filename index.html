<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potato Leaf Disease Detector</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 900px; margin: 30px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 30px; }
        header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #eef2f5; padding-bottom: 15px; }
        header h1 { color: #2c3e50; font-size: 1.8rem; margin-bottom: 8px; }
        .badge { background: #e8f5e9; color: #2e7d32; font-size: 0.85rem; font-weight: bold; padding: 4px 12px; border-radius: 20px; display: inline-block; }
        
        .upload-section { border: 2px dashed #b0bec5; border-radius: 10px; padding: 30px; text-align: center; background: #fafafa; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .upload-section:hover { background: #f0f4f8; border-color: #4caf50; }
        input[type="file"] { display: none; }
        
        .preview-container { display: none; margin: 20px 0; text-align: center; }
        .preview-container img { max-width: 280px; max-height: 280px; border-radius: 8px; border: 1px solid #ddd; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        .btn { background: #4caf50; color: white; border: none; padding: 12px 25px; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .btn:hover { background: #43a047; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        .result-card { display: none; background: #f9fbf9; border: 1px solid #c8e6c9; border-radius: 10px; padding: 20px; margin-top: 25px; }
        .prediction-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .prediction-title { font-size: 1.3rem; font-weight: bold; color: #1b5e20; }
        .confidence-tag { font-size: 1.1rem; font-weight: bold; color: #2e7d32; }

        .progress-group { margin-top: 15px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; font-weight: 600; }
        .progress-bar-bg { background: #e0e0e0; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
        .progress-bar-fill { height: 100%; background: #4caf50; width: 0%; transition: width 0.6s ease; }

        .loader { display: none; margin: 15px auto; border: 4px solid #f3f3f3; border-top: 4px solid #4caf50; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🥔 Potato Leaf Disease AI Classifier</h1>
        <span class="badge">Model Validation Accuracy: 97.67%</span>
    </header>

    <div class="upload-section" onclick="document.getElementById('fileInput').click();">
        <p>📷 <strong>Click to upload</strong> or drag & drop a potato leaf image</p>
        <span style="font-size: 0.85rem; color: #777;">Supports JPG, PNG, JPEG</span>
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
    </div>

    <div class="preview-container" id="previewContainer">
        <img id="imagePreview" alt="Image Preview">
        <div style="margin-top: 15px;">
            <button class="btn" id="predictBtn" onclick="uploadAndPredict()">Analyze Disease</button>
        </div>
    </div>

    <div class="loader" id="loader"></div>

    <div class="result-card" id="resultCard">
        <div class="prediction-header">
            <div>
                <span style="font-size: 0.85rem; color: #666;">Top Prediction</span>
                <div class="prediction-title" id="predictedClass">-</div>
            </div>
            <div>
                <span style="font-size: 0.85rem; color: #666;">Confidence</span>
                <div class="confidence-tag" id="predictedConfidence">0%</div>
            </div>
        </div>

        <h4 style="margin-top: 15px; margin-bottom: 10px; font-size: 0.95rem; color: #444;">Class Probabilities Breakdown:</h4>
        <div class="progress-group" id="probabilitiesContainer"></div>
    </div>
</div>

<script>
    let selectedFile = null;

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('previewContainer').style.display = 'block';
                document.getElementById('resultCard').style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    async function uploadAndPredict() {
        if (!selectedFile) return;

        const btn = document.getElementById('predictBtn');
        const loader = document.getElementById('loader');
        const resultCard = document.getElementById('resultCard');

        btn.disabled = true;
        loader.style.display = 'block';
        resultCard.style.display = 'none';

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok && data.success) {
                document.getElementById('predictedClass').innerText = data.prediction;
                document.getElementById('predictedConfidence').innerText = data.confidence + '%';

                const probContainer = document.getElementById('probabilitiesContainer');
                probContainer.innerHTML = '';

                for (const [className, prob] of Object.entries(data.probabilities)) {
                    const roundedProb = prob.toFixed(2);
                    probContainer.innerHTML += `
                        <div class="progress-label">
                            <span>${className}</span>
                            <span>${roundedProb}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${roundedProb}%;"></div>
                        </div>
                    `;
                }

                resultCard.style.display = 'block';
            } else {
                alert(data.error || 'Prediction failed.');
            }
        } catch (error) {
            alert('Error connecting to the backend server.');
            console.error(error);
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
